<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anticópia — Comunidade gratuita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800;1,900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121212;
    --card-from: #252525;
    --card-to: #1b1b1b;
    --card-border: #505050;
    --ink: #ffffff;
    --muted: #b3b3b3;
    --soft: #ebebeb;
    --discord: #5865F2;
    --discord-soft: #CED2FF;
    --whatsapp: #4ACA59;
    --whatsapp-grad-a: #57D163;
    --whatsapp-grad-b: #23B33A;
    --whatsapp-soft: #DDFFE0;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: #0a0a0a;
    color: var(--ink);
    font-family: "Poppins", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 0;
  }

  /* ---------- Dynamic background: white particles rising ---------- */
  @keyframes floatDot{
    0%{ transform: translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.6; }
    50%{ transform: translateY(-160px) translateX(10px); }
    90%{ opacity:0.4; }
    100%{ transform: translateY(-320px) translateX(-8px); opacity:0; }
  }

  .bg-fx{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
    background:#0a0a0a;
  }
  .bg-fx .dot{
    position:absolute;
    bottom:-20px;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#ffffff;
    box-shadow:0 0 4px rgba(255,255,255,0.6);
    animation: floatDot linear infinite;
  }

  @media (prefers-reduced-motion: reduce){
    .bg-fx .dot{ animation:none; opacity:0; }
  }

  .screen{
    width:100%;
    max-width:423px;
    min-height:100vh;
    background: transparent;
    position:relative;
    overflow:hidden;
    padding: 14px 26px 40px;
    display:flex;
    flex-direction:column;
    z-index:1;
  }

  /* subtle ambient glow */
  .screen::before{
    content:"";
    position:absolute;
    top:-120px;
    left:50%;
    width:420px;
    height:320px;
    transform:translateX(-50%);
    background: radial-gradient(circle, rgba(255,255,255,0.06), transparent 70%);
    pointer-events:none;
  }

  /* ---------- Header ---------- */
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:7px;
    color:#A1A1A1;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    width:fit-content;
    z-index:2;
    transition: color .15s ease, transform .15s ease;
  }
  .back-link:hover{ color:#d4d4d4; transform: translateX(-2px); }
  .back-link svg{ width:14px; height:14px; }

  /* ---------- Hero ---------- */
  .hero{
    margin-top: 12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    z-index:2;
  }

  .app-icon{
    width:44px;
    height:45px;
    border-radius:9px;
    background:#000;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:14px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.5);
  }
  .app-icon img{ width:100%; height:100%; object-fit:cover; display:block; }

  .title-wrap{
    margin-bottom:12px;
    display:flex;
    justify-content:center;
  }
  .brand-img{
    width:100%;
    max-width:300px;
    height:auto;
    display:block;
  }

  .subtitle{
    color:#cfcfcf;
    font-size:13.3px;
    line-height:1.6;
    margin: 0 0 18px;
    text-align:center;
  }
  .subtitle strong{ color:#fff; font-weight:700; }
  .pill{
    display:inline-block;
    padding: 1px 6px;
    border-radius:0;
    font-weight:700;
    color:#fff;
    font-size: 0.95em;
  }
  .pill.discord{ background: var(--discord); }
  .pill.whatsapp{ background: var(--whatsapp); }

  .members{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
  }
  .avatar-stack{
    display:flex;
    align-items:center;
  }
  .avatar-stack img{
    height:36px;
    width:auto;
    display:block;
  }
  .members-count{
    text-align:left;
    line-height:1.05;
  }
  .members-count .num{
    display:block;
    font-weight:800;
    font-size:17px;
    color:#fff;
  }
  .members-count .label{
    display:block;
    font-size:12px;
    color:#b3b3b3;
    font-weight:500;
  }

  /* ---------- Cards ---------- */
  .cards{
    display:flex;
    flex-direction:column;
    gap:21px;
    z-index:2;
  }

  .card{
    background: linear-gradient(125deg, var(--card-from), var(--card-to));
    border:1px solid var(--card-border);
    border-radius:0;
    padding:22px 22px 24px;
    transition: border-color .2s ease, transform .2s ease;
  }
  .card:hover{
    border-color:#6b6b6b;
    transform: translateY(-2px);
  }

  .card-head{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:18px;
  }
  .icon-wrap{
    position:relative;
    width:48px;
    height:48px;
    flex-shrink:0;
  }
  .icon-wrap .badge-dot{
    position:absolute;
    top:-6px;
    left:-6px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.55);
    z-index:2;
  }
  .icon-wrap .badge-dot svg{ width:10px; height:10px; color:#fff; }

  .icon-tile{
    width:48px;
    height:48px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon-tile.discord{ background: var(--discord); }
  .icon-tile.whatsapp{
    background: linear-gradient(160deg, var(--whatsapp-grad-a), var(--whatsapp-grad-b));
    border-radius:50%;
    border:2.5px solid #fff;
    box-sizing:border-box;
  }
  .icon-tile svg{ width:26px; height:26px; }

  .card-title-block{ display:flex; flex-direction:column; justify-content:center; gap:6px; }
  .tag{
    width:fit-content;
    font-size:11px;
    font-weight:700;
    color:#fff;
    padding:3px 10px;
    border-radius:6px;
  }
  .tag.discord{ background: var(--discord); }
  .tag.whatsapp{ background: var(--whatsapp); }

  .card h2{
    margin:0;
    font-family:"Poppins", sans-serif;
    font-weight:700;
    font-size:22px;
    line-height:1;
    color:#fff;
  }

  .divider{
    border:none;
    border-top:1px solid #353535;
    margin: 0 0 16px;
  }

  .card p{
    margin:0 0 16px;
    font-size:13.5px;
    line-height:1.55;
    color:#b3b3b3;
  }

  .card a.cta{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    font-weight:700;
    text-decoration:none;
    transition: gap .15s ease, opacity .15s ease;
  }
  .card a.cta:hover{ gap:10px; opacity:0.85; }
  .card .cta.discord{ color: var(--discord-soft); }
  .card .cta.whatsapp{ color: var(--whatsapp); }

  .card-img-link {
    display: block;
    transform: translateY(0);
    transition: transform .2s ease, box-shadow .2s ease;
    cursor: pointer;
  }
  .card-img-link:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 28px rgba(0,0,0,0.45);
  }
  .card-img-link img {
    width: 100%;
    display: block;
    border-radius: 0;
  }

  footer{
    margin-top:36px;
    text-align:center;
    color:#5c5c5c;
    font-size:12px;
    z-index:2;
  }

  @media (max-width:380px){
    h1.brand{ font-size:34px; }
    .screen{ padding: 22px 18px 32px; }
  }
</style>
</head>
